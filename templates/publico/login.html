{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="fx-auth">
  <h1>Ingresa a TecniGo</h1>
  <p class="text-muted">Usa el correo con el que te registraste.</p>

  <form method="post" class="fx-card needs-validation" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="correo">Correo electrónico</label>
      <input class="form-control" type="email" id="correo" name="correo" autocomplete="email" required>
      <div class="invalid-feedback">Escribe un correo válido.</div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="clave">Contraseña</label>
      <input class="form-control" type="password" id="clave" name="clave" autocomplete="current-password" required>
      <div class="invalid-feedback">Escribe tu contraseña.</div>
    </div>
    <button class="btn btn-fx btn-lg w-100" type="submit">Ingresar</button>
    <p class="text-center mt-3 mb-0"><a href="#" data-pronto>¿Olvidaste tu contraseña?</a></p>
  </form>

  <p class="text-center mt-3">¿Aún no tienes cuenta? <a href="{% url 'registro_cliente' %}">Crear cuenta</a></p>

</div>
{% endblock %}
